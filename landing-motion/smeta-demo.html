<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Смета за пару кликов</title>
<link rel="stylesheet" href="bro-ui.css">
<style>
body{background:#F8F5F0;display:grid;place-items:center;min-height:100vh;padding:24px;margin:0}
.est-card .tbl .row,.est-card .tbl .sub{transition:opacity .35s ease-out}
.est-card.pre .tbl .row,.est-card.pre .tbl .sub{opacity:0}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="stage" id="st"></div></div>
<script src="data.js"></script>
<script src="bro-ui.js"></script>
<script>
(() => {
const B = BRO, U = UI, I = U.I, st = document.getElementById('st');

/* Экран 1. Создание объекта и сметы (макет 2739:21933) */
const create = U.shell({ active: 'all', obj: true, objNew: true, est: true }, `
  <div class="create">
    <h1>Создание</h1>
    <div class="card">
      <h2>${I.bld.replace(/18/g, 26)}Объект</h2>
      <div class="g2">
        <div><div class="lbl">Название объекта <i>*</i></div><div class="fld" id="fName"><span class="ph">Введите название</span></div></div>
        <div><div class="lbl">Город поставки товара <i>*</i> ${I.info}</div><div class="fld">${B.object.city}<span class="dd">${I.tri}</span></div></div>
        <div><div class="lbl">Клиент</div><div class="fld" id="fClient"><span class="ph">Выберите</span><span class="dd">${I.tri}</span></div></div>
        <div><div class="lbl">Адрес объекта</div><div style="display:flex;gap:8px"><div class="fld" id="fAddr" style="flex:1"><span class="ph">Добавить адрес</span></div><span class="btn y" style="width:36px;padding:0">${I.pin}</span></div></div>
      </div>
    </div>
    <div class="card">
      <h2 style="justify-content:space-between"><span style="display:flex;gap:8px;align-items:center">${I.table.replace(/18/g, 26)}Смета</span><u style="font-size:12px;font-weight:400;color:#4A56A0">Не добавлять смету к объекту</u></h2>
      <div class="lbl">Название сметы <i>*</i></div><div class="fld" id="fEst"><span class="ph">Введите название</span></div>
      <div class="opts">
        <div class="opt" id="oEmpty"><span class="rad"></span><div><b>Смета пустая</b>Вносите позиции сметы вручную через BRO</div></div>
        <div class="opt" id="oTpl"><span class="rad y"></span><div><b>Смета из шаблона</b>Выберите готовый или системный шаблон</div></div>
        <div class="opt"><span class="rad"></span><div><b>Смета из файла</b>Заполните смету в Excel по образцу</div></div>
      </div>
      <div class="tplbox" id="tplbox">
        <div class="seg"><span class="on">${I.tpl}Системные шаблоны</span><span>${I.tpl}Мои шаблоны</span></div>
        ${B.templates.map((t, i) => `<div class="tpl" ${i === 0 ? 'id="tpl0"' : ''}>${t}${i === 0 ? `<span class="tag">${B.sections.reduce((a, s) => a + s.items.length, 0)} позиций</span>` : ''}</div>`).join('')}
      </div>
    </div>
    <div class="card foot"><span class="btn lg">${I.arrowL}Отменить</span><span class="btn lg y" id="bCreate">${I.check}Создать смету и объект</span></div>
  </div>`);

/* Экран 2. Смета «Ремонт ванной» (макет 3177:49791) */
const estimate = U.shell({ active: 'est', obj: true, est: true }, `
  ${U.crumbs('Объекты', B.object.name, B.estimate.name)}
  ${U.estHead()}
  <div class="card est est-card pre" id="estCard">
    <div class="est-h"><h2>Смета на сумму: <span id="total">0,00</span></h2><span class="btn">${I.share}Поделиться</span><span class="btn" id="bDl">${I.dl}Скачать</span></div>
    ${U.estTable('pro', { collapsed: true, open: [0, 1, 2] })}
  </div>
  <div class="ov" id="ov"></div>
  <div class="modal bro" id="modal">
    <h3>Скачать смету ${I.x}</h3>
    <div class="box"><h4>Формат</h4><div style="display:flex;gap:24px;align-items:center"><span style="display:flex;gap:8px;align-items:center"><span class="rad on"></span>PDF ${I.pdf}</span><span style="display:flex;gap:8px;align-items:center"><span class="rad"></span>Excel ${I.xls}</span></div></div>
    <div class="box"><h4>Колонтитулы</h4><div class="g2"><div><div class="lbl">Верхний колонтитул</div><div class="fld">${B.company}<span class="dd">${I.tri}</span></div></div><div><div class="lbl">Нижний колонтитул</div><div class="fld">Контакты мастера<span class="dd">${I.tri}</span></div></div></div></div>
    <div style="display:flex;justify-content:flex-end;gap:12px"><span class="btn lg">Отменить</span><span class="btn lg y" id="bDo">Скачать смету</span></div>
  </div>
  <div class="toast bro" id="toast">${I.pdf}Ремонт ванной.pdf скачан</div>`);

st.innerHTML = `<div class="scr" id="sCreate">${create}</div><div class="scr" id="sEst">${estimate}</div>`;
const S = U.scene(document.getElementById('wrap'));
const $ = S.$, show = id => S.$$('.scr').forEach(n => n.classList.toggle('on', n.id === id));
const total = B.totals.total;

function reset() {
  ['fName', 'fAddr', 'fEst'].forEach(id => $('#' + id).innerHTML = '<span class="ph">' + (id === 'fAddr' ? 'Добавить адрес' : 'Введите название') + '</span>');
  $('#fClient').innerHTML = `<span class="ph">Выберите</span><span class="dd">${I.tri}</span>`;
  S.$$('.fld').forEach(n => n.classList.remove('focus'));
  $('#oTpl').classList.remove('on'); $('#oTpl .rad').classList.remove('on');
  $('#tplbox').classList.remove('in'); $('#tpl0').classList.remove('on');
  $('#estCard').classList.add('pre'); $('#total').textContent = '0,00';
  $('#ov').classList.remove('on'); $('#modal').classList.remove('on'); $('#toast').classList.remove('on');
}
function filled() {
  $('#fName').textContent = B.object.name; $('#fAddr').textContent = 'ул. Пушкинская, 12, кв. 8';
  $('#fClient').innerHTML = `${B.client.name}<span class="dd">${I.tri}</span>`; $('#fEst').textContent = B.estimate.name;
  $('#oTpl').classList.add('on'); $('#oTpl .rad').classList.add('on'); $('#tplbox').classList.add('in'); $('#tpl0').classList.add('on');
}
async function revealEstimate() {
  const rows = S.$$('#estCard .tbl .row, #estCard .tbl .sub');
  rows.forEach(r => r.style.opacity = 0); $('#estCard').classList.remove('pre');
  rows.forEach((r, i) => setTimeout(() => r.style.opacity = '', 120 + i * 55));
  const t0 = performance.now(), dur = 1300;
  await new Promise(res => { (function tick(t) { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); $('#total').textContent = B.fmt(Math.round(total * e)); k < 1 ? requestAnimationFrame(tick) : res(); })(t0); });
  $('#total').textContent = B.fmt(total);
}
async function field(id, text) { const f = $('#' + id); await S.go(f, 700, -120); await S.click(); f.classList.add('focus'); f.innerHTML = '<span></span><span class="caret"></span>'; await S.type(f.firstChild, text); f.classList.remove('focus'); f.textContent = text; }

S.run(async () => {
  reset(); show('sCreate'); S.jump(1300, 980); $('#sbObj').classList.remove('in');
  await S.sleep(500);
  S.caption('1', 'Создайте объект');
  await field('fName', B.object.name);
  await S.go('#fClient', 600, -100); await S.click(); $('#fClient').innerHTML = `${B.client.name}<span class="dd">${I.tri}</span>`; await S.sleep(250);
  await field('fAddr', 'ул. Пушкинская, 12, кв. 8');
  await field('fEst', B.estimate.name);
  S.caption('2', 'Выберите шаблон');
  await S.go('#oTpl', 700, -60); await S.click(); $('#oTpl').classList.add('on'); $('#oTpl .rad').classList.add('on'); $('#tplbox').classList.add('in');
  await S.sleep(650);
  await S.go('#tpl0', 700, -140); await S.click(); $('#tpl0').classList.add('on'); await S.sleep(500);
  await S.go('#bCreate', 800); await S.click(); await S.sleep(200);
  S.caption('3', 'Смета готова, цены Петровича внутри');
  show('sEst'); $('#sbObj').classList.add('in');
  await revealEstimate(); await S.sleep(1300);
  S.caption('4', 'Скачайте PDF для заказчика');
  await S.go('#bDl', 900); await S.click(); $('#ov').classList.add('on'); $('#modal').classList.add('on'); await S.sleep(900);
  await S.go('#bDo', 800); await S.click(); $('#ov').classList.remove('on'); $('#modal').classList.remove('on');
  await S.sleep(250); $('#toast').classList.add('on'); await S.sleep(1800);
  S.hideCap(); S.hideCur(); await S.sleep(700);
}, n => {
  // Статичные состояния: 0 смета, 1 выбор шаблона, 2 скачивание
  if (n === 1) { reset(); filled(); show('sCreate'); return; }
  show('sEst'); $('#sbObj').classList.add('in'); $('#estCard').classList.remove('pre'); $('#total').textContent = B.fmt(total);
  if (n === 2) { $('#ov').classList.add('on'); $('#modal').classList.add('on'); }
});
})();
</script>
</body>
</html>
