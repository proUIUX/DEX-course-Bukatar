<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Петрович.BRO: смета за пару кликов (демо)</title>
<style>
:root{--ink:#262A3B;--yel:#FFCC33}
*{box-sizing:border-box;margin:0}
body{font-family:"SF Pro Display",Inter,system-ui,sans-serif;background:#F8F5F0;display:grid;place-items:center;min-height:100vh;padding:24px}
/* Сцена в координатах макета 1440x1024, масштабируется скриптом */
.wrap{width:min(1100px,100%);aspect-ratio:1440/1024;position:relative;border-radius:20px;overflow:hidden;box-shadow:0 24px 64px rgba(80,50,0,.18);background:#fff}
.stage{position:absolute;left:0;top:0;width:1440px;height:1024px;transform-origin:0 0}
.shot{position:absolute;inset:0;width:1440px;height:1024px;opacity:0;transition:opacity .35s ease-out}
.shot.on{opacity:1}
.hl{position:absolute;border:3px solid var(--yel);border-radius:10px;background:rgba(255,204,51,.18);opacity:0;transition:opacity .2s}
.hl.on{opacity:1}
.cur{position:absolute;left:0;top:0;width:34px;height:34px;z-index:9;pointer-events:none;opacity:0;transition:transform .9s cubic-bezier(.3,.7,.2,1),opacity .25s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.cur.on{opacity:1}
.ring{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,204,51,.6);z-index:8;opacity:0;pointer-events:none}
.ring.go{animation:rg .45s ease-out}
@keyframes rg{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(1.3)}}
.cap{position:absolute;left:50%;top:28px;transform:translate(-50%,-12px);background:var(--ink);color:#fff;border-radius:100px;padding:14px 28px;font-size:26px;font-weight:500;letter-spacing:-.01em;opacity:0;transition:opacity .3s ease-out,transform .3s ease-out;white-space:nowrap;z-index:10}
.cap.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.cur,.ring,.cap{display:none}}
</style>
</head>

    <div class="hl" id="hl"></div>
    <svg class="cur" id="cur" viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#262A3B" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <div class="ring" id="ring"></div>
    <div class="cap" id="cap"></div>
  </div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const wrap=$('#wrap'),st=$('#st'),cur=$('#cur'),ring=$('#ring'),hl=$('#hl'),cap=$('#cap');
const shots={create:$('#s_create'),est:$('#s_est'),tpl:$('#s_tpl'),res:$('#s_res'),dl:$('#s_dl')};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let run=0,visible=true;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function fit(){st.style.transform=`scale(${wrap.clientWidth/1440})`}
addEventListener('resize',fit);fit();
function show(k){for(const n in shots)shots[n].classList.toggle('on',n===k)}
let cx=1300,cy=980;
async function move(x,y,ms=950){cx=x;cy=y;cur.style.transform=`translate(${x}px,${y}px)`;await sleep(ms)}
async function click(){ring.style.left=cx+'px';ring.style.top=cy+'px';ring.classList.remove('go');void ring.offsetWidth;ring.classList.add('go');await sleep(220)}
function caption(t){cap.classList.remove('on');setTimeout(()=>{cap.textContent=t;cap.classList.add('on')},180)}
function mark(x,y,w,h){hl.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;hl.classList.add('on')}
function unmark(){hl.classList.remove('on')}
async function loop(id){
  while(id===run){
    show('create');unmark();cap.classList.remove('on');
    cur.style.transition='none';cur.style.transform=`translate(1300px,980px)`;cx=1300;cy=980;void cur.offsetWidth;cur.style.transition='';cur.classList.add('on');
    await sleep(500);
    caption('1. Создайте смету в объекте');
    await move(850,544);await click();show('est');await sleep(700);
    caption('2. Выберите шаблон');
    await move(850,684);await click();show('tpl');await sleep(700);
    await move(760,819);mark(486,804,728,32);await click();await sleep(500);
    caption('3. Смета готова');
    await move(1045,1008);unmark();await click();show('res');await sleep(1800);
    caption('4. Поделитесь или скачайте');
    await move(1347,310);await click();show('dl');await sleep(900);
    await move(888,636);await click();await sleep(1300);
    cap.classList.remove('on');cur.classList.remove('on');await sleep(700);
    while(!visible&&id===run)await sleep(300);
  }
}
if(reduce){show('res')}else{run=Date.now();loop(run)}
new IntersectionObserver(e=>{visible=e[0].isIntersecting},{threshold:.2}).observe(wrap);
})();
</script>
